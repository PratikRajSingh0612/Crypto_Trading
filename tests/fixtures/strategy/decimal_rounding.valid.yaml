schema_version: "1.0.0"
strategy_id: strat_55555555-6666-4777-8888-999999999999
display_name: Decimal Rounding
description: Isolates exact Decimal arithmetic, half-even rounding at the declared precision, and unsigned zero.
strategy_family: rounding_probe
market_type: SPOT
direction: LONG
timeframe: 1h
universe:
  kind: STATIC
  instruments:
    - BINANCE:BTC/USDT:SPOT
required_capabilities:
  - schema_version: "1.0.0"
    capability: market.spot
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: direction.long
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: data.ohlcv
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: execution.bar_market
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: runtime.backtest
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels: []
parameters:
  window_three:
    value_type: INTEGER
    value: 3
    minimum: 1
# `mean_three` divides by three, so its cells are the exact recurring quotients
# the declared context rounds half-even at its full precision; `sum_three` adds
# only, so its cells are exact and one of them is zero. The exit rule negates a
# zero literal, which is the one operation that produces a signed zero, and
# proves that the evaluator normalizes it instead of letting canonical
# serialization refuse it.
features:
  - id: close_now
    operation: source.bar_field/v1
    inputs:
      - bar.close
    parameters: {}
    output_type: DECIMAL
    warm_up_bars: 0
    missing_value_policy: PROPAGATE_FALSE
  - id: mean_three
    operation: rolling.mean/v1
    inputs:
      - bar.close
    parameters:
      window: window_three
    output_type: DECIMAL
    warm_up_bars: 0
    missing_value_policy: PROPAGATE_FALSE
  - id: sum_three
    operation: rolling.sum/v1
    inputs:
      - bar.close
    parameters:
      window: window_three
    output_type: DECIMAL
    warm_up_bars: 0
    missing_value_policy: PROPAGATE_FALSE
entry_rules:
  - id: enter_when_mean_is_positive
    expression:
      op: greater_than
      left:
        op: ref
        id: mean_three
        bars_ago: 0
      right:
        op: literal
        value_type: DECIMAL
        value: "0"
exit_rules:
  - id: exit_when_negated_zero_is_positive
    expression:
      op: greater_than
      left:
        op: negate
        operand:
          op: literal
          value_type: DECIMAL
          value: "0"
      right:
        op: literal
        value_type: DECIMAL
        value: "0"
sizing_intent:
  method: FRACTION_OF_AVAILABLE_QUOTE
  fraction: "1"
risk_assumptions:
  leverage: "1"
  shorting_allowed: false
warm_up_requirements:
  minimum_bars: 0
comparison_requirements:
  maximum_level: LEVEL_2
supported_approximation_policy:
  default: REJECT
engine_extensions: []
authoring_metadata:
  author: local_user
  created_at_utc: "2026-08-10T00:00:00Z"
