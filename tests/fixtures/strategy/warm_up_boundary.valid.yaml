schema_version: "1.0.0"
strategy_id: strat_11111111-2222-4333-8444-555555555555
display_name: Warm Up Boundary
description: Isolates the exact first bar on which each feature becomes available after its declared warm-up.
strategy_family: warm_up_probe
market_type: SPOT
direction: LONG
timeframe: 1h
universe:
  kind: STATIC
  instruments:
    - BINANCE:BTC/USDT:SPOT
required_capabilities:
  - schema_version: "1.0.0"
    capability: market.spot
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: direction.long
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: data.ohlcv
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: execution.bar_market
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: runtime.backtest
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels: []
parameters:
  window_three:
    value_type: INTEGER
    value: 3
    minimum: 1
  shift_one:
    value_type: INTEGER
    value: 1
    minimum: 0
# Three features, each pinning a different first-available bar:
#   close_now   declares 0 and is available from bar 0;
#   mean_three  declares 2 and is available from bar 2, the exact boundary;
#   delayed     declares 2 - the minimum its dependency permits - yet cannot
#               carry a value until bar 3, because shifting mean_three back one
#               bar reads mean_three's own warm-up cell at bar 2. Declared
#               warm-up being at least the dependency maximum does not make a
#               feature available on that bar.
features:
  - id: close_now
    operation: source.bar_field/v1
    inputs:
      - bar.close
    parameters: {}
    output_type: DECIMAL
    warm_up_bars: 0
    missing_value_policy: PROPAGATE_FALSE
  - id: mean_three
    operation: rolling.mean/v1
    inputs:
      - bar.close
    parameters:
      window: window_three
    output_type: DECIMAL
    warm_up_bars: 2
    missing_value_policy: PROPAGATE_FALSE
  - id: delayed
    operation: shift/v1
    inputs:
      - mean_three
    parameters:
      bars: shift_one
    output_type: DECIMAL
    warm_up_bars: 2
    missing_value_policy: PROPAGATE_FALSE
entry_rules:
  - id: enter_when_mean_is_positive
    expression:
      op: greater_than
      left:
        op: ref
        id: mean_three
        bars_ago: 0
      right:
        op: literal
        value_type: DECIMAL
        value: "0"
exit_rules:
  - id: exit_when_delayed_is_missing
    expression:
      op: is_missing
      operand:
        op: ref
        id: delayed
        bars_ago: 0
sizing_intent:
  method: FRACTION_OF_AVAILABLE_QUOTE
  fraction: "1"
risk_assumptions:
  leverage: "1"
  shorting_allowed: false
warm_up_requirements:
  minimum_bars: 2
comparison_requirements:
  maximum_level: LEVEL_2
supported_approximation_policy:
  default: REJECT
engine_extensions: []
authoring_metadata:
  author: local_user
  created_at_utc: "2026-08-10T00:00:00Z"
