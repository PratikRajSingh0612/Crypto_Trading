schema_version: "1.0.0"
strategy_id: strat_66666666-7777-4888-9999-aaaaaaaaaaaa
display_name: Adjacent Entry Exit
description: Isolates an entry and an exit signal occurring on immediately adjacent bars.
strategy_family: adjacency_probe
market_type: SPOT
direction: LONG
timeframe: 1h
universe:
  kind: STATIC
  instruments:
    - BINANCE:BTC/USDT:SPOT
required_capabilities:
  - schema_version: "1.0.0"
    capability: market.spot
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: direction.long
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: data.ohlcv
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: execution.bar_market
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: runtime.backtest
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels: []
parameters:
  window_two:
    value_type: INTEGER
    value: 2
    minimum: 1
# A two-bar rolling mean crossing a bar field, so the mechanism differs from the
# two-bar-field pair `crossover_equality` uses and no equality edge occurs here:
# every comparison is a strict inequality. The bar series is chosen so the entry
# signal fires on one bar and the exit signal on the very next bar, and so that
# the mean's warm-up cell suppresses an otherwise-true exit on bar one.
features:
  - id: mean_two
    operation: rolling.mean/v1
    inputs:
      - bar.close
    parameters:
      window: window_two
    output_type: DECIMAL
    warm_up_bars: 1
    missing_value_policy: PROPAGATE_FALSE
  - id: open_now
    operation: source.bar_field/v1
    inputs:
      - bar.open
    parameters: {}
    output_type: DECIMAL
    warm_up_bars: 0
    missing_value_policy: PROPAGATE_FALSE
entry_rules:
  - id: enter_cross
    expression:
      op: crosses_above
      left:
        op: ref
        id: mean_two
        bars_ago: 0
      right:
        op: ref
        id: open_now
        bars_ago: 0
exit_rules:
  - id: exit_cross
    expression:
      op: crosses_below
      left:
        op: ref
        id: mean_two
        bars_ago: 0
      right:
        op: ref
        id: open_now
        bars_ago: 0
sizing_intent:
  method: FRACTION_OF_AVAILABLE_QUOTE
  fraction: "1"
risk_assumptions:
  leverage: "1"
  shorting_allowed: false
warm_up_requirements:
  minimum_bars: 1
comparison_requirements:
  maximum_level: LEVEL_2
supported_approximation_policy:
  default: REJECT
engine_extensions: []
authoring_metadata:
  author: local_user
  created_at_utc: "2026-08-10T00:00:00Z"
