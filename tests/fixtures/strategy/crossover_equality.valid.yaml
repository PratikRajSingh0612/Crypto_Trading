schema_version: "1.0.0"
strategy_id: strat_22222222-3333-4444-9555-666666666666
display_name: Crossover Equality
description: Isolates the equality edge of the approved crossover definition on both the prior and the current bar.
strategy_family: crossover_probe
market_type: SPOT
direction: LONG
timeframe: 1h
universe:
  kind: STATIC
  instruments:
    - BINANCE:BTC/USDT:SPOT
required_capabilities:
  - schema_version: "1.0.0"
    capability: market.spot
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: direction.long
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: data.ohlcv
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_1
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: execution.bar_market
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels:
      - LEVEL_2
  - schema_version: "1.0.0"
    capability: runtime.backtest
    required: true
    minimum_semantics: capabilities/v1
    approximation_policy: REJECT
    comparison_levels: []
parameters: {}
# Two bar fields read directly, so the crossover sees exactly the bar series and
# no rolling window can blur the equality edge. `bar.close` is the left operand
# and `bar.open` the right, so one bar expresses both operands independently.
features:
  - id: fast_close
    operation: source.bar_field/v1
    inputs:
      - bar.close
    parameters: {}
    output_type: DECIMAL
    warm_up_bars: 0
    missing_value_policy: PROPAGATE_FALSE
  - id: slow_open
    operation: source.bar_field/v1
    inputs:
      - bar.open
    parameters: {}
    output_type: DECIMAL
    warm_up_bars: 0
    missing_value_policy: PROPAGATE_FALSE
entry_rules:
  - id: enter_cross
    expression:
      op: crosses_above
      left:
        op: ref
        id: fast_close
        bars_ago: 0
      right:
        op: ref
        id: slow_open
        bars_ago: 0
exit_rules:
  - id: exit_cross
    expression:
      op: crosses_below
      left:
        op: ref
        id: fast_close
        bars_ago: 0
      right:
        op: ref
        id: slow_open
        bars_ago: 0
sizing_intent:
  method: FRACTION_OF_AVAILABLE_QUOTE
  fraction: "1"
risk_assumptions:
  leverage: "1"
  shorting_allowed: false
warm_up_requirements:
  minimum_bars: 0
comparison_requirements:
  maximum_level: LEVEL_2
supported_approximation_policy:
  default: REJECT
engine_extensions: []
authoring_metadata:
  author: local_user
  created_at_utc: "2026-08-10T00:00:00Z"
